[project]
name = "robolake"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Harshith Raju", email = "har29shith@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "mcap>=1.6.0",
    "mcap-ros2-support>=0.6.0",
    "polars>=2.2.0",
    "pyarrow>=26.0.1",
]

[project.scripts]
robolake = "robolake:main"

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
